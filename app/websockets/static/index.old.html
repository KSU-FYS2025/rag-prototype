<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice agent test</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --ink: #1d2433;
            --muted: #5d6677;
            --line: #d9dde5;
            --accent: #0f766e;
            --accent-ink: #ffffff;
            --danger: #b42318;
            --ok: #15803d;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12161d;
                --panel: #1a202a;
                --ink: #e7eaf0;
                --muted: #97a0b0;
                --line: #2c3441;
                --accent: #2dd4bf;
                --accent-ink: #06201d;
                --danger: #f97066;
                --ok: #4ade80;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 16px 48px;
        }

        h1 {
            font-size: 1.35rem;
            margin: 0 0 4px;
        }

        .sub {
            color: var(--muted);
            margin: 0 0 24px;
            max-width: 60ch;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (max-width: 600px) {
            .fields {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        input[type="text"] {
            width: 100%;
            font: inherit;
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px 10px;
        }

        input:focus-visible, button:focus-visible, summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        button {
            font: inherit;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            padding: 8px 16px;
            cursor: pointer;
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--line);
            flex: none;
        }

        .dot.busy {
            background: #d97706;
        }

        .dot.live {
            background: var(--ok);
        }

        .dot.error {
            background: var(--danger);
        }

        .status.error {
            color: var(--danger);
        }

        #transcript {
            min-height: 220px;
            max-height: 360px;
            overflow-y: auto;
        }

        #transcript:empty::before {
            content: "Start the session and speak. The conversation appears here.";
            color: var(--muted);
        }

        .line {
            margin: 0 0 10px;
        }

        .line strong {
            margin-right: 4px;
        }

        .line.agent strong {
            color: var(--accent);
        }

        .typed {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .typed input {
            flex: 1;
        }

        details summary {
            cursor: pointer;
            font-weight: 600;
        }

        #log {
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
            font: 0.8125rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            color: var(--muted);
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<main>
    <h1>Voice agent test</h1>
    <p class="sub">Streams your microphone to the websocket and plays the agent's spoken replies. Use headphones, or the
        agent will hear itself and interrupt.</p>

    <section class="panel">
        <div class="fields">
            <div>
                <label for="path">Websocket path</label>
                <input id="path" type="text" value="/ws/audio" autocomplete="off">
            </div>
            <div>
                <label for="user">User id</label>
                <input id="user" type="text" value="test-user" autocomplete="off">
            </div>
            <div>
                <label for="session">Session id</label>
                <input id="session" type="text" autocomplete="off">
            </div>
        </div>
        <div class="controls">
            <button id="start" class="primary">Start session</button>
            <button id="stop" disabled>Stop session</button>
            <div id="statusWrap" class="status"><span id="dot" class="dot"></span><span id="status">Not connected</span>
            </div>
        </div>
    </section>

    <section class="panel">
        <div id="transcript" aria-live="polite"></div>
        <div class="typed">
            <input id="text" type="text" placeholder="Type a message to the agent" autocomplete="off" disabled>
            <button id="send" disabled>Send message</button>
        </div>
    </section>

    <section class="panel">
        <details open>
            <summary>Event log</summary>
            <div id="log"></div>
        </details>
    </section>
</main>

<script>
    const SEND_RATE = 16000;    // the Live API expects 16 kHz mono PCM16 going in...
    const RECV_RATE = 24000;    // ...and sends back 24 kHz mono PCM16
    const CHUNK_SAMPLES = 512;  // 32 ms of mic audio per websocket message

    // Runs on the audio thread: turns mic floats into Int16 PCM and posts fixed-size chunks.
    const workletSource = `
class PcmCapture extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buf = new Int16Array(${CHUNK_SAMPLES});
    this.n = 0;
  }
  process(inputs) {
    const channel = inputs[0][0];
    if (!channel) return true;
    for (let i = 0; i < channel.length; i++) {
      const s = Math.max(-1, Math.min(1, channel[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.buffer, [this.buf.buffer]);
        this.buf = new Int16Array(${CHUNK_SAMPLES});
        this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor("pcm-capture", PcmCapture);
`;

    const $ = (id) => document.getElementById(id);
    const el = {
        path: $("path"), user: $("user"), session: $("session"),
        start: $("start"), stop: $("stop"),
        statusWrap: $("statusWrap"), dot: $("dot"), status: $("status"),
        transcript: $("transcript"), text: $("text"), send: $("send"), log: $("log"),
    };

    el.session.value = "session-" + Math.random().toString(36).slice(2, 8);

    let ws = null, ctx = null, node = null, stream = null;
    let running = false, opened = false;
    let nextPlayTime = 0;
    const playing = [];
    const current = {user: null, agent: null};

    // ---------- UI helpers ----------

    function setUi(state, text) {
        el.status.textContent = text;
        el.dot.className = "dot " + (state === "idle" ? "" : state);
        el.statusWrap.className = "status" + (state === "error" ? " error" : "");
        const inactive = state === "idle" || state === "error";
        el.start.disabled = !inactive;
        el.stop.disabled = inactive;
        el.text.disabled = el.send.disabled = state !== "live";
    }

    function log(msg) {
        const line = document.createElement("div");
        line.textContent = new Date().toLocaleTimeString() + "  " + msg;
        el.log.append(line);
        while (el.log.childElementCount > 300) el.log.firstChild.remove();
        el.log.scrollTop = el.log.scrollHeight;
    }

    // Transcripts arrive in small pieces: keep appending to the speaker's current line.
    function appendTranscript(who, text) {
        const other = who === "user" ? "agent" : "user";
        current[other] = null;
        if (!current[who]) {
            const row = document.createElement("p");
            row.className = "line " + who;
            const name = document.createElement("strong");
            name.textContent = who === "user" ? "You" : "Agent";
            const body = document.createElement("span");
            row.append(name, body);
            el.transcript.append(row);
            current[who] = body;
        }
        current[who].textContent += text;
        el.transcript.scrollTop = el.transcript.scrollHeight;
    }

    // ---------- playback ----------

    function playPcm(arrayBuffer) {
        if (!ctx) return;
        const pcm = new Int16Array(arrayBuffer);
        const samples = new Float32Array(pcm.length);
        for (let i = 0; i < pcm.length; i++) {
            samples[i] = pcm[i] / (pcm[i] < 0 ? 0x8000 : 0x7fff);
        }

        // The buffer is declared at 24 kHz; the browser resamples to the context rate.
        const buffer = ctx.createBuffer(1, samples.length, RECV_RATE);
        buffer.copyToChannel(samples, 0);

        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        src.onended = () => {
            const i = playing.indexOf(src);
            if (i !== -1) playing.splice(i, 1);
        };

        // Queue chunks back to back; a small lead-in avoids a click on the first chunk.
        const now = ctx.currentTime;
        if (nextPlayTime < now) nextPlayTime = now + 0.05;
        src.start(nextPlayTime);
        nextPlayTime += buffer.duration;
        playing.push(src);
    }

    function flushPlayback() {
        playing.splice(0).forEach((src) => {
            src.onended = null;
            try {
                src.stop();
            } catch {
            }
        });
        nextPlayTime = 0;
    }

    // ---------- websocket messages ----------

    function onMessage(event) {
        if (typeof event.data !== "string") {
            playPcm(event.data);          // binary frame: agent audio
            return;
        }
        let msg;
        try {
            msg = JSON.parse(event.data); // text frame: JSON
        } catch {
            log("Unreadable text frame: " + event.data);
            return;
        }
        switch (msg.event) {
            case "user_transcript":
                appendTranscript("user", msg.text);
                break;
            case "agent_transcript":
                appendTranscript("agent", msg.text);
                break;
            case "interrupted":
                flushPlayback();
                current.agent = null;
                log("Interrupted, playback cleared");
                break;
            case "turn_complete":
                current.user = current.agent = null;
                log("Turn complete");
                break;
            default:
                log(JSON.stringify(msg));
        }
    }

    // ---------- session lifecycle ----------

    async function start() {
        if (running) return;

        const user = el.user.value.trim();
        const session = el.session.value.trim();
        let path = el.path.value.trim();
        if (!user || !session || !path) {
            setUi("error", "Enter a path, user id and session id");
            return;
        }
        if (!path.startsWith("/")) path = "/" + path;

        running = true;
        opened = false;
        current.user = current.agent = null;

        // 1. Microphone first, so a denied permission never leaves a socket open.
        setUi("busy", "Waiting for microphone access");
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true},
            });
        } catch (err) {
            log("Microphone error: " + err.message);
            teardown("error", "Microphone unavailable. Allow access and try again.");
            return;
        }

        // 2. Audio graph at 16 kHz, so the mic stream already matches what the API wants.
        try {
            ctx = new AudioContext({sampleRate: SEND_RATE});
            await ctx.resume();
            if (ctx.sampleRate !== SEND_RATE) {
                throw new Error("browser gave a " + ctx.sampleRate + " Hz context instead of " + SEND_RATE + " Hz");
            }
            const moduleUrl = URL.createObjectURL(new Blob([workletSource], {type: "application/javascript"}));
            await ctx.audioWorklet.addModule(moduleUrl);
            URL.revokeObjectURL(moduleUrl);

            const source = ctx.createMediaStreamSource(stream);
            node = new AudioWorkletNode(ctx, "pcm-capture");
            node.port.onmessage = (e) => {
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data);
            };
            // Muted sink so the worklet keeps running without playing the mic back.
            const mute = ctx.createGain();
            mute.gain.value = 0;
            source.connect(node);
            node.connect(mute);
            mute.connect(ctx.destination);
        } catch (err) {
            log("Audio setup error: " + err.message);
            teardown("error", "Audio setup failed (Chrome-based browsers work best).");
            return;
        }

        // 3. Websocket, with the same scheme as the page and the ids as query params.
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const query = new URLSearchParams({user_id: user, session_id: session});
        const url = proto + "//" + location.host + path + "?" + query;
        log("Connecting to " + url);
        setUi("busy", "Connecting");

        const sock = new WebSocket(url);
        sock.binaryType = "arraybuffer";
        ws = sock;
        sock.onopen = () => {
            opened = true;
            setUi("live", "Live. Speak now");
            log("Connected");
        };
        sock.onmessage = onMessage;
        sock.onerror = () => log("WebSocket error");
        sock.onclose = (e) => {
            log("Connection closed (code " + e.code + ")");
            if (opened) teardown("idle", "Session ended");
            else teardown("error", "Could not connect. Check the path, user id and session id.");
        };
    }

    function stop() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({event: "stop"}));
        }
        teardown("idle", "Stopped");
    }

    // Safe to call more than once; releases everything the session opened.
    function teardown(state, text) {
        const sock = ws;
        ws = null;
        if (sock) {
            sock.onopen = sock.onmessage = sock.onerror = sock.onclose = null;
            if (sock.readyState === WebSocket.CONNECTING || sock.readyState === WebSocket.OPEN) sock.close();
        }
        flushPlayback();
        if (node) {
            node.port.onmessage = null;
            node.disconnect();
            node = null;
        }
        if (stream) {
            stream.getTracks().forEach((t) => t.stop());
            stream = null;
        }
        if (ctx) {
            ctx.close().catch(() => {
            });
            ctx = null;
        }
        running = false;
        setUi(state, text);
    }

    function sendText() {
        const text = el.text.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({event: "text", text}));
        appendTranscript("user", text);
        current.user = null;
        el.text.value = "";
    }

    el.start.addEventListener("click", start);
    el.stop.addEventListener("click", stop);
    el.send.addEventListener("click", sendText);
    el.text.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendText();
    });
    window.addEventListener("pagehide", () => teardown("idle", "Not connected"));
</script>
</body>
</html>
