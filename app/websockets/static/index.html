<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice agent test</title>
</head>
<body>
<h1>Voice agent test</h1>
<p>Streams your microphone to the websocket and plays the agent's spoken replies. Use headphones, or the agent will hear
    itself and interrupt.</p>

<p>
    <label for="path">Websocket path</label>
    <input id="path" type="text" value="/ws/audio" autocomplete="off">
</p>

<p>
    <button id="start">Start session</button>
    <button id="stop" disabled>Stop session</button>
</p>
<p>Status: <span id="status">Not connected</span></p>

<h2>Conversation</h2>
<div id="transcript" aria-live="polite"></div>
<p>
    <input id="text" type="text" placeholder="Type a message to the agent" autocomplete="off" disabled>
    <button id="send" disabled>Send message</button>
</p>

<h2>Event log</h2>
<pre id="log"></pre>

<script>
    const SEND_RATE = 16000;    // the Live API expects 16 kHz mono PCM16 going in...
    const RECV_RATE = 24000;    // ...and sends back 24 kHz mono PCM16
    const CHUNK_SAMPLES = 512;  // 32 ms of mic audio per websocket message

    // Runs on the audio thread: turns mic floats into Int16 PCM and posts fixed-size chunks.
    const workletSource = `
class PcmCapture extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buf = new Int16Array(${CHUNK_SAMPLES});
    this.n = 0;
  }
  process(inputs) {
    const channel = inputs[0][0];
    if (!channel) return true;
    for (let i = 0; i < channel.length; i++) {
      const s = Math.max(-1, Math.min(1, channel[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.buffer, [this.buf.buffer]);
        this.buf = new Int16Array(${CHUNK_SAMPLES});
        this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor("pcm-capture", PcmCapture);
`;

    const $ = (id) => document.getElementById(id);
    const el = {
        path: $("path"),
        start: $("start"), stop: $("stop"), status: $("status"),
        transcript: $("transcript"), text: $("text"), send: $("send"), log: $("log"),
    };

    let ws = null, ctx = null, node = null, stream = null;
    let running = false, opened = false;
    let nextPlayTime = 0;
    const playing = [];
    const current = {user: null, agent: null};

    // ---------- UI helpers ----------

    function setUi(state, text) {
        el.status.textContent = text;
        const inactive = state === "idle" || state === "error";
        el.start.disabled = !inactive;
        el.stop.disabled = inactive;
        el.text.disabled = el.send.disabled = state !== "live";
    }

    function log(msg) {
        const line = document.createElement("div");
        line.textContent = new Date().toLocaleTimeString() + "  " + msg;
        el.log.append(line);
        while (el.log.childElementCount > 300) el.log.firstChild.remove();
    }

    // Transcripts arrive as small chunks (finished = false), followed by one final event
    // (finished = true) that repeats the whole utterance. Append chunks for live captions,
    // then replace the line with the final text instead of appending it a second time.
    function showTranscript(who, text, finished) {
        const other = who === "user" ? "agent" : "user";
        current[other] = null;
        if (!current[who]) {
            const row = document.createElement("p");
            const name = document.createElement("strong");
            name.textContent = who === "user" ? "You: " : "Agent: ";
            const body = document.createElement("span");
            row.append(name, body);
            el.transcript.append(row);
            current[who] = body;
        }
        if (finished) {
            current[who].textContent = text;
            current[who] = null;
        } else {
            current[who].textContent += text;
        }
    }

    // ---------- playback ----------

    function playPcm(arrayBuffer) {
        if (!ctx) return;
        const pcm = new Int16Array(arrayBuffer);
        const samples = new Float32Array(pcm.length);
        for (let i = 0; i < pcm.length; i++) {
            samples[i] = pcm[i] / (pcm[i] < 0 ? 0x8000 : 0x7fff);
        }

        // The buffer is declared at 24 kHz; the browser resamples to the context rate.
        const buffer = ctx.createBuffer(1, samples.length, RECV_RATE);
        buffer.copyToChannel(samples, 0);

        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        src.onended = () => {
            const i = playing.indexOf(src);
            if (i !== -1) playing.splice(i, 1);
        };

        // Queue chunks back to back; a small lead-in avoids a click on the first chunk.
        const now = ctx.currentTime;
        if (nextPlayTime < now) nextPlayTime = now + 0.05;
        src.start(nextPlayTime);
        nextPlayTime += buffer.duration;
        playing.push(src);
    }

    function flushPlayback() {
        playing.splice(0).forEach((src) => {
            src.onended = null;
            try {
                src.stop();
            } catch {
            }
        });
        nextPlayTime = 0;
    }

    // ---------- websocket messages ----------

    function onMessage(event) {
        if (typeof event.data !== "string") {
            playPcm(event.data);          // binary frame: agent audio
            return;
        }
        let msg;
        try {
            msg = JSON.parse(event.data); // text frame: JSON
        } catch {
            log("Unreadable text frame: " + event.data);
            return;
        }
        switch (msg.event) {
            case "user_transcript":
                showTranscript("user", msg.text, msg.finished);
                break;
            case "agent_transcript":
                showTranscript("agent", msg.text, msg.finished);
                break;
            case "interrupted":
                flushPlayback();
                current.agent = null;
                log("Interrupted, playback cleared");
                break;
            case "turn_complete":
                current.user = current.agent = null;
                log("Turn complete");
                break;
            default:
                log(JSON.stringify(msg));
        }
    }

    // ---------- session lifecycle ----------

    async function start() {
        if (running) return;

        let path = el.path.value.trim();
        if (!path) {
            setUi("error", "Enter a websocket path");
            return;
        }
        if (!path.startsWith("/")) path = "/" + path;

        running = true;
        opened = false;
        current.user = current.agent = null;

        // 1. Microphone first, so a denied permission never leaves a socket open.
        setUi("busy", "Waiting for microphone access");
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true},
            });
        } catch (err) {
            log("Microphone error: " + err.message);
            teardown("error", "Microphone unavailable. Allow access and try again.");
            return;
        }

        // 2. Audio graph at 16 kHz, so the mic stream already matches what the API wants.
        try {
            ctx = new AudioContext({sampleRate: SEND_RATE});
            await ctx.resume();
            if (ctx.sampleRate !== SEND_RATE) {
                throw new Error("browser gave a " + ctx.sampleRate + " Hz context instead of " + SEND_RATE + " Hz");
            }
            const moduleUrl = URL.createObjectURL(new Blob([workletSource], {type: "application/javascript"}));
            await ctx.audioWorklet.addModule(moduleUrl);
            URL.revokeObjectURL(moduleUrl);

            const source = ctx.createMediaStreamSource(stream);
            node = new AudioWorkletNode(ctx, "pcm-capture");
            node.port.onmessage = (e) => {
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data);
            };
            // Muted sink so the worklet keeps running without playing the mic back.
            const mute = ctx.createGain();
            mute.gain.value = 0;
            source.connect(node);
            node.connect(mute);
            mute.connect(ctx.destination);
        } catch (err) {
            log("Audio setup error: " + err.message);
            teardown("error", "Audio setup failed (Chrome-based browsers work best).");
            return;
        }

        // 3. Websocket, using the same scheme as the page.
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const url = proto + "//" + location.host + path;
        log("Connecting to " + url);
        setUi("busy", "Connecting");

        const sock = new WebSocket(url);
        sock.binaryType = "arraybuffer";
        ws = sock;
        sock.onopen = () => {
            opened = true;
            setUi("live", "Live. Speak now");
            log("Connected");
        };
        sock.onmessage = onMessage;
        sock.onerror = () => log("WebSocket error");
        sock.onclose = (e) => {
            log("Connection closed (code " + e.code + ")");
            if (opened) teardown("idle", "Session ended");
            else teardown("error", "Could not connect. Check the websocket path.");
        };
    }

    function stop() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({event: "stop"}));
        }
        teardown("idle", "Stopped");
    }

    // Safe to call more than once; releases everything the session opened.
    function teardown(state, text) {
        const sock = ws;
        ws = null;
        if (sock) {
            sock.onopen = sock.onmessage = sock.onerror = sock.onclose = null;
            if (sock.readyState === WebSocket.CONNECTING || sock.readyState === WebSocket.OPEN) sock.close();
        }
        flushPlayback();
        if (node) {
            node.port.onmessage = null;
            node.disconnect();
            node = null;
        }
        if (stream) {
            stream.getTracks().forEach((t) => t.stop());
            stream = null;
        }
        if (ctx) {
            ctx.close().catch(() => {
            });
            ctx = null;
        }
        running = false;
        setUi(state, text);
    }

    function sendText() {
        const text = el.text.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({event: "text", text}));
        showTranscript("user", text, true);
        el.text.value = "";
    }

    el.start.addEventListener("click", start);
    el.stop.addEventListener("click", stop);
    el.send.addEventListener("click", sendText);
    el.text.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendText();
    });
    window.addEventListener("pagehide", () => teardown("idle", "Not connected"));
</script>
</body>
</html>
