on:
  push:
    branches:
      - dev
# Template using https://docs.astral.sh/uv/guides/integration/github/#installation
jobs:
  test_backend:
    name: Test Backend
    runs-on: ubuntu-latest
    environment: actions-environment

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # Cache HuggingFace models BEFORE installing project dependencies
      # This ensures models are cached early and reused across workflow runs
      - name: Cache HuggingFace models
        id: hf-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-paraphrase-albert-small-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            huggingface-${{ runner.os }}-paraphrase-albert-small-v2-

      - name: Install Project
        run: uv sync --locked --all-extras --dev
        env:
          UV_PYTHON: ${{ env.pythonLocation }}

      # Pre-download embedding model to populate cache before tests run
      # This prevents repeated downloads on every test run in CI/CD
      - name: Pre-initialize embedding model
        run: |
          uv run python -c "
          import os
          os.environ['HF_HOME'] = os.path.expanduser('~/.cache/huggingface')
          os.environ['POI_JSON_PATH'] = '${{ vars.POI_JSON_PATH }}'
          from app.database.db import embedding_fn
          print('Pre-initializing embedding model...')
          embedding_fn.initialize(max_retries=3)
          if embedding_fn._embedding_fn:
            print('✓ Embedding model successfully cached')
          else:
            print('⚠ Embedding model initialization failed, tests will attempt retry')
          "

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: ollama serve &

      - name: Wait for Ollama to be Ready
        run: |
          until curl -s http://127.0.0.1:11434 > /dev/null; do
            sleep 1
          done

      - name: Cache Ollama models
        uses: actions/cache@v5
        with:
          path: ~/.ollama/models
          key: ollama-${{ vars.AI_MODEL }}

      - name: Pull configured model
        run: ollama pull ${{ vars.AI_MODEL }}

      - name: Run tests
        env:
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-r1:8b' }}
          DB_URL: ${{ vars.DB_URL || 'database.db' }}
          POI_JSON_PATH: ${{ vars.POI_JSON_PATH || 'NavigationFireDynamicMesh_POIs.json' }}
        run: uv run pytest ./app/tests/tests.py -v
