on:
  push:
    branches:
      - dev
# Template using https://docs.astral.sh/uv/guides/integration/github/#installation
jobs:
  setup_python:
    name: Setup Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup environment file
        run: |
          echo "AI_MODEL=${{ vars.AI_MODEL }}" >> .env
          echo "DB_URL=${{ vars.DB_URL }}" >> .env
          echo "POI_JSON_PATH=${{ vars.POI_JSON_PATH }}" >> .env

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest ./app/tests/tests.py
